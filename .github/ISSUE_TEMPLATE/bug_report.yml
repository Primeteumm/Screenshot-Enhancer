name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Win+Shift+S
        2. Drag the thumbnail into ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom right of the Settings window.
      placeholder: v0.1.10
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Multiple monitors, display scaling, screenshot tool used, logs from running with SE_DEBUG=1, screenshots...
